<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LoveCo · 切换到 LoveCo 键盘</title>
<style>
  /* ============================================================
     参考: ScreenRecording_09-28-2026 18-17-45_1.mov  (884x504)
     参考整帧 = 640x365（参考尺寸 x 0.7240）。
     布局坐标一律在 640x365 里量；出片画幅默认裁到键盘 #pad = 562x322
     （SCALE=2 → 1124x644），见下面 html.crop 那段。
     所有状态由 window.__seek(t) 算出，页面内无任何 CSS animation
     ============================================================ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:640px;height:365px;overflow:hidden;background:transparent}
  body{
    font-family:"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:relative;width:640px;height:365px;overflow:hidden}

  /* ============================================================
     画幅 = 键盘骨架图（#pad）本身。
     参考视频整帧是 640x365，键盘只占中间一块，外面那圈是白卡/背景。
     用户 2026-09-29：成片不要那圈，直接裁到键盘 —— 于是把舞台整体左上移
     (39, 27)，视口缩成 562x322（@2x = 1124x644），视口外的内容自然被裁掉。
     平移量必须是整数 px，并且和 #pad 的 left/top 严格一致，否则边上会漏透明缝。
     ?frame=full 或 ?shell=1（三层复刻版）回到完整的 640x365。
     ============================================================ */
  html.crop,html.crop body{width:562px;height:322px}
  html.crop #stage{left:-39px;top:-27px}

  /* ============================================================
     只出「最里面一层」（键盘底板 #pad + 内容），背景和卡片默认不画。
     页面背景 = 透明 → 渲染时用 ?alpha=1 出带透明通道的 mov；
     想让 Chrome 垫白底出 mp4（播放器兼容），就不发那条 background override —— 见 run.sh。
     想回到复刻参考视频的三层外观，加 ?shell=1。
     ============================================================ */
  html.shell, html.shell body{
    background:
      radial-gradient(120% 120% at 8% 0%,  #f4f6fe 0%, #f5f5fd 45%, #faf3f7 100%);
  }

  /* ---- 卡片 + 键盘底板 ---- */
  #card{
    display:none;                            /* 第 2 层：默认不要 */
    position:absolute;left:24.6px;top:13px;width:591.5px;height:343.2px;
    background:#fff;border-radius:34px;
    box-shadow:0 5px 22px rgba(112,122,180,.10), 0 1px 3px rgba(112,122,180,.04);
  }
  html.shell #card{display:block}
  /* ---- 键盘底板 = 成片画幅本身 ----
     裁到整数框 (39,27,562,322) 上，和上面 html.crop 的平移量严格对齐：
     左边 39+39、上边 27+27 → 裁出来的第一像素就是底板的边。 */
  #pad{
    position:absolute;left:39px;top:27px;width:562px;height:322px;
    background:#f2eef2;
    border-radius:0;                  /* 用户 2026-09-29：键盘四角要直角 */
  }
  /* 只有复刻参考视频的三层版才用参考里的圆角 */
  html.shell #pad{border-radius:21px}

  /* ---- 按键（骨架 UI） ---- */
  .key{position:absolute;background:#e6e2e6;border-radius:6.5px}

  /* ---- 地球键 ---- */
  #globe{position:absolute;left:60.7px;top:281.4px;width:42.7px;height:42.7px;color:#4b4b53}
  /* 尺寸/位置量自参考帧：地球外沿 x 60.7..103.4  y 281.4..324.1（42.7 见方） */

  /* ---- 长按涟漪 ---- */
  #ripple{position:absolute;left:0;top:0;width:640px;height:365px;pointer-events:none}

  /* ---- 菜单 ---- */
  #menu{
    position:absolute;left:60.8px;top:40.5px;width:213.6px;height:183.2px;
    background:#fff;border-radius:13px;
    box-shadow:0 3px 16px rgba(80,90,140,.16), 0 0 0 .5px rgba(80,90,140,.05);
    overflow:hidden;
  }
  #menu .item{position:absolute;left:0;width:100%;display:flex;
              align-items:center;justify-content:center;
              font-size:21px;color:#1c1c1e}
  #menu #mPinyin{top:0;height:74px}
  #menu #mLove{top:125.2px;height:57.2px;background:#037cff;color:#fff;
               font-size:22.5px;font-weight:400}

  /* ---- 手势（用户提供的描边图标，potrace 矢量化；只有线条层，内部透明） ---- */
  .hand{position:absolute;overflow:visible}
  .hand .line{fill:#141414;fill-rule:evenodd}

  /* ---- 落地大字（白描边黑字） ---- */
  #titles{position:absolute;left:0;top:0;width:640px;height:365px;pointer-events:none}
  #titles text{
    font-family:"PingFang SC","Helvetica Neue",sans-serif;
    font-size:55px;font-weight:600;letter-spacing:-2px;
    stroke-linejoin:round;stroke-linecap:round;
  }
  /* 双层：外层撑白描边，内层用同色描边把笔画加粗到参考的厚度 */
  #titles .out{fill:#0d0d0d;stroke:#fff;stroke-width:12;paint-order:stroke}
  #titles .sol{fill:#0d0d0d;stroke:#0d0d0d;stroke-width:2.2;paint-order:stroke}
  /* 标题里的品牌名单独上蓝色；两层各一个 class，描边层只改 fill、加粗层 fill+stroke 都要改 */
  #titles .brandOut{fill:#0a6cf5}
  #titles .brandSol{fill:#0a6cf5;stroke:#0a6cf5}
</style>
</head>

<script>
/* ================= 时间轴（数值全部量自参考视频） ================= */
const TIMELINE = {
  width: 640, height: 365, fps: 30, duration: 4.15,

  // 落地大字：0.00-2.22 第一句，2.22-4.15 第二句
  t1: { from: 0.00, to: 2.22 },
  t2: { from: 2.22, to: 4.15 },

  // 手势：硬切换（与参考一致）
  hand1: { from: 0.30, to: 2.33 },
  hand2: { from: 2.97, to: 99 },

  // 菜单整体淡入（参考里是线性渐显）
  menu: { from: 2.49, to: 3.00 },

  // 涟漪跟着手势走：两处都有（参考里点 LoveCo 时同样有波纹）
  ripple1: { from: 0.30, to: 2.33, cx: 85.4,  cy: 306.3 },
  ripple2: { from: 2.97, to: 4.20, cx: 226.0, cy: 199.0 },

  // 手势锚点（指尖）设计坐标。
  // 画幅裁到键盘（562x322）之后，底板下沿只有 y=349 了：
  // 指尖在 303，手高 458*0.094 = 43.1 → 下沿 346.1，加浮动仍然落在底板里。
  // 这是「缩小画幅」逼出来的尺寸/位置（原画幅 365 高时是 0.17 / 306.3）。
  tip1: [85.4, 303.0],
  tip2: [226.0, 199.0],
  tipPath: [99, 0],        // 指尖在 viewBox(339x458) 里的位置（已裁到墨迹包围盒）
  handScale: 0.094,        // 位图原始px -> 设计px（339x458 显示成 31.9x43.1）
  float: 0.8,              // 手停留时轻微浮动幅度(px)
};

/* ================= 骨架按键 ================= */
(function buildKeys(){
  const box = document.getElementById('keys');
  const ROWS = [
    { top: 27.5,  h: 39.8, n: 9 },
    { top: 86.9,  h: 39.8, n: 9 },
    { top: 169.4, h: 62.3, n: 9 },   // 最下一行字母键更高
  ];
  const W = 47.8, GAP = 9.6, LEFT = 60.6;
  let html = '';
  for (const r of ROWS){
    for (let i = 0; i < r.n; i++){
      html += `<div class="key" style="left:${(LEFT + i * (W + GAP)).toFixed(1)}px;`
            + `top:${r.top}px;width:${W}px;height:${r.h}px"></div>`;
    }
  }
  box.innerHTML = html;
})();

/* ================= 状态计算 ================= */
const $ = (id) => document.getElementById(id);
const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

function seg(t, a, b){ return t >= a && t < b ? 1 : 0; }
// 短暂淡入淡出（8ms）：参考里是硬切换，这里留一点点过渡避免闪帧
function edge(t, from, to, soft){
  soft = soft === undefined ? 0.06 : soft;
  if (t < from - soft || t >= to + soft) return 0;
  return Math.min(smooth((t - from + soft) / (2 * soft)), smooth((to + soft - t) / (2 * soft)));
}

function placeHand(el, tip, t, from, opacity){
  const s = TIMELINE.handScale, [px, py] = TIMELINE.tipPath;
  el.style.left = (tip[0] - px * s).toFixed(2) + 'px';
  el.style.top  = (tip[1] - py * s).toFixed(2) + 'px';
  el.style.opacity = opacity;
  // 停留期间轻微上下浮动，避免画面完全静止
  el.style.transform = 'translateY(' + (opacity > 0 ? Math.sin(t * 2.0) * TIMELINE.float : 0).toFixed(2) + 'px)';
}

function drawRipple(t){
  const rp = TIMELINE.ripple1, rq = TIMELINE.ripple2, svg = $('ripple');
  let out = '';
  for (const R of [rp, rq]){
    const o = edge(t, R.from, R.to, 0.10);
    if (o <= 0) continue;
    const lt = t - R.from;
    // 中心按压高亮
    out += `<circle cx="${R.cx}" cy="${R.cy}" r="9" fill="#0a6cf5" opacity="${(0.34 * o).toFixed(3)}"/>`;
    for (let i = 0; i < 3; i++){
      const p = ((lt * 0.78 + i / 3) % 1);
      const r = 12 + p * 44;
      const a = (1 - p) * 0.95 * o;
      out += `<circle cx="${R.cx}" cy="${R.cy}" r="${r.toFixed(1)}" fill="none"`
           + ` stroke="#0a6cf5" stroke-width="${(5.0 - p * 2.2).toFixed(1)}" opacity="${a.toFixed(3)}"/>`;
    }
  }
  svg.innerHTML = out;
}

window.__seek = function(t){
  // 大字
  const o1 = edge(t, TIMELINE.t1.from, TIMELINE.t1.to, 0.02);
  const o2 = edge(t, TIMELINE.t2.from, TIMELINE.t2.to, 0.02);
  $('ttl1').style.opacity = o1;
  $('ttl2').style.opacity = o2;

  // 菜单
  const mo = Math.max(0, Math.min(1, (t - TIMELINE.menu.from) / (TIMELINE.menu.to - TIMELINE.menu.from)));
  $('menu').style.opacity = mo;

  // 手势
  const h1 = edge(t, TIMELINE.hand1.from, TIMELINE.hand1.to, 0.05);
  const h2 = edge(t, TIMELINE.hand2.from, TIMELINE.hand2.to, 0.05);
  placeHand($('hand1'), TIMELINE.tip1, t, TIMELINE.hand1.from, h1);
  placeHand($('hand2'), TIMELINE.tip2, t, TIMELINE.hand2.from, h2);

  // 涟漪
  drawRipple(t);
};

// ---- 画幅：默认裁到键盘骨架图（#pad）本身 ----
// 布局坐标仍然在 640x365 里，这里只把视口缩成 562x322 并把舞台左上移；
// 视口外的东西（原本那圈白底/透明边）自然就被裁掉了。
// ?frame=full 或 ?shell=1（复刻参考片的三层版）回到完整 640x365。
const Q = new URLSearchParams(location.search);
const FRAME = { x: 39, y: 27, w: 562, h: 322 };   // 必须和 #pad / html.crop 一致
const shell = Q.get('shell') === '1';
const cropped = !shell && Q.get('frame') !== 'full';
if (cropped){
  document.documentElement.classList.add('crop');
  TIMELINE.width = FRAME.w;
  TIMELINE.height = FRAME.h;
}
if (shell) document.documentElement.classList.add('shell');

// 手势尺寸跟着 handScale 走，省得 SVG 的 width/height 属性和它走散
for (const el of document.querySelectorAll('.hand')){
  el.setAttribute('width',  (339 * TIMELINE.handScale).toFixed(2));
  el.setAttribute('height', (458 * TIMELINE.handScale).toFixed(2));
}

// ?t=1.23 直接定位到某一时刻（抽帧核对用）
window.__seek(parseFloat(Q.get('t') || '0') || 0);
</script>

</html>
