<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LoveCo 安卓键盘 · HTML 版</title>
<style>
  :root{
    --w: 640px;
    --h: 456px;
    --ink: #1f1f1f;          /* Android 列表主文字 */
    --muted: #5f6368;        /* 副标题 / 说明灰 */
    --skel: #ebedef;         /* 骨架块 */
    --sw-off: #e3e5e8;       /* 关闭态开关轨道（M2 风格：灰轨 + 白点） */
    --sw-on: #3782ff;        /* 开启态开关（从参考图取的真实像素中位数） */
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:var(--w); height:var(--h); overflow:hidden; background:#f5f6f7; }
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{ position:relative; width:var(--w); height:var(--h);
    background:linear-gradient(170deg,#fafbfc 0%,#f5f6f8 52%,#eef0f3 100%);
    overflow:hidden; }

  /* ---------- Android 设置列表卡片 ----------
     行之间不画分隔线（Material 3 的列表本来就没有），靠行高和留白分组 */
  #card{ position:absolute; left:24px; top:24px; width:592px; height:324px;
    background:#fff; border-radius:24px;
    box-shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.05); }

  .row{ position:relative; height:108px; display:flex; align-items:center; padding:0 26px; }

  /* 图标位：真图标是 LoveCo 的位图；骨架行是同尺寸的灰圆角块 */
  .icon{ width:62px; height:62px; border-radius:15px; flex:none; margin-right:26px;
    display:block; overflow:hidden; }
  .icon.sk{ background:var(--skel); }
  .icon img{ width:100%; height:100%; display:block; }

  .label{ font-size:26px; font-weight:500; color:var(--ink); letter-spacing:.2px; line-height:1.12; }
  .sub{ font-size:18px; color:var(--muted); margin-top:6px; line-height:1.12; }

  /* 骨架文字条：两条宽度不同，看起来才像"内容还在加载"而不是复制粘贴 */
  .skbar{ height:24px; border-radius:9px; background:var(--skel); }

  /* ---------- Android 开关（灰轨 + 白点；打开时蓝底从左往右长出来） ---------- */
  .toggle{ margin-left:auto; width:80px; height:46px; border-radius:23px; position:relative; flex:none; }
  .toggle .track{ position:absolute; inset:0; border-radius:23px; background:var(--sw-off); }
  .toggle .fill{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:23px;
    background:var(--sw-on); }
  .toggle .knob{ position:absolute; top:4px; left:4px; width:38px; height:38px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3), 0 0 1px rgba(0,0,0,.16); }
  .toggle.sk{ background:var(--skel); }

  /* ---------- 光标（与另外两支片同一只手，路径由参考图矢量化而来） ---------- */
  #cursor{ position:absolute; left:0; top:0; width:68px; height:68px;
    transform-origin:25.5px 3.6px; z-index:20; will-change:transform; }
  #cursor svg{ width:100%; height:100%; display:block;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.28)); }

  #ripple{ position:absolute; width:76px; height:76px; margin:-38px 0 0 -38px; border-radius:50%;
    background:rgba(55,130,255,.22); z-index:19; }

  /* 对勾落在卡片下方的留白里 —— 列表是主角，收尾别盖住它 */
  #done{ position:absolute; left:320px; top:400px; width:82px; height:82px; margin:-41px 0 0 -41px;
    border-radius:50%; background:#00911b; display:flex; align-items:center; justify-content:center;
    z-index:15; }
  #done svg{ width:45px; height:45px; }

  #subtitle{
    position:absolute; left:0; right:0; bottom:14px; text-align:center;
    font-size:20px; font-weight:600; letter-spacing:1px; color:#fff;
    -webkit-text-stroke:4px rgba(72,72,72,.9);
    paint-order:stroke fill;
    z-index:30;
  }
</style>
</head>
<body>
<div id="stage">

  <div id="card">

    <!-- 第 1 行：骨架 -->
    <div class="row">
      <div class="icon sk"></div>
      <div class="skbar" style="width:178px"></div>
      <div class="toggle sk"></div>
    </div>

    <!-- 第 2 行：LoveCo（唯一的真 item） -->
    <div class="row" id="rowLoveCo">
      <div class="icon"><img src="assets/loveco-icon.png" alt="LoveCo"></div>
      <div>
        <div class="label">LoveCo</div>
        <div class="sub">中文（中国）</div>
      </div>
      <div class="toggle" id="tgOn">
        <div class="track"></div>
        <div class="fill"></div>
        <div class="knob"></div>
      </div>
    </div>

    <!-- 第 3 行：骨架 -->
    <div class="row">
      <div class="icon sk"></div>
      <div class="skbar" style="width:136px"></div>
      <div class="toggle sk"></div>
    </div>

  </div>

  <div id="ripple"></div>

  <div id="done">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5"
      stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div id="cursor">
    <svg viewBox="0 0 512 512" fill="none">
      <path fill="#242424" fill-rule="evenodd" d="M225.9 485C224.6 484.9 222.4 484.6 221 484.3C218.7 483.8 217.2 483.4 213 482.1C209.8 481.2 203.6 478.1 200.4 476C200.1 475.8 199.4 475.3 198.8 474.9C195.1 472.5 190.7 468.4 185.1 462.2C183.4 460.3 179.4 455.9 178.5 455C176.8 453.2 175.4 451.6 173.1 449.1C171.7 447.6 170.5 446.2 170.2 446C170 445.8 168.8 444.4 167.5 443C166.2 441.6 165 440.2 164.8 440C164.5 439.8 163.3 438.4 162 437C160.7 435.6 159.5 434.2 159.2 434C159 433.8 157.8 432.4 156.5 431C153.6 427.8 153.6 427.9 152.1 426.2C151.4 425.5 149.8 423.7 148.5 422.3C147.2 420.8 145.8 419.4 145.5 419C143.8 417.2 142.4 415.6 140.1 413.1C138.7 411.6 137.5 410.2 137.2 410C136.8 409.5 134.1 406.6 132.6 405C132.1 404.4 130.5 402.6 129.1 401.1C127.7 399.6 126.5 398.2 126.2 398C126 397.8 124.8 396.4 123.5 395C122.2 393.6 121 392.2 120.8 392C118.8 389.9 117.5 388.5 115.5 386.3C114.2 384.8 112.8 383.4 112.5 383C102.9 372.8 99.1 366.9 95.7 357C91.6 345.1 92 327.8 96.6 317.6C96.8 317.2 97 316.7 97 316.6C97 316.1 100.1 310 101.3 308C103 305.3 103.9 304.1 124.3 276.9L143.9 250.9L144 160L144.1 69.1L144.7 66.5C145.4 62.9 146.1 60.4 146.9 58.4C147.3 57.4 147.7 56.2 147.9 55.8C148.3 54.7 149.9 51.4 150.6 50.4C153.7 45.5 156.4 42.2 160.5 38.6C173.5 27 192.2 23.6 209.1 29.8C217.9 33.1 227 40.4 232.1 48.4C232.6 49.2 233.3 50.2 233.5 50.5C233.9 51.2 235.7 54.7 236.2 55.9C239.8 65.2 239.8 65.1 240 89.5C240.1 112.6 239.9 110.5 242.3 109.5C260 102.9 283.8 111.4 295.1 128.4C296.5 130.6 296.3 130.5 299.1 129.1C300.4 128.5 302.1 127.8 302.9 127.5C303.7 127.2 304.9 126.7 305.5 126.5C306.2 126.2 306.9 126 307.1 126C307.3 126 308.3 125.8 309.3 125.5C317.2 123.4 327.6 124 335.6 126.9C338.9 128.1 339.2 128.2 340.4 128.8C350.1 133.7 357.2 140.7 362.1 150.3C363.5 153.2 363.7 153.3 365.1 152.6C366.3 152 366.9 151.8 370.1 150.8C380.7 147.5 394.4 148.2 402.8 152.5C403.3 152.8 403.8 153 404 153C404.3 153 409.2 155.8 410.4 156.6C415.3 160 420 164.8 422.9 169.2C423.5 170.3 424.3 171.4 424.5 171.8C426.5 174.7 429.2 181.8 430.3 186.6C432 193.9 431.9 184.6 431.9 293C431.9 400.3 432 392.7 430.5 400.9C429.6 406 429 408.1 427.5 413.4C422.3 430.5 410.9 448.5 397.6 460C396.8 460.7 395.8 461.6 395.4 462C392.9 464.1 385.9 469.2 382.8 471C377.7 473.9 373.5 476.1 370.1 477.4C366.9 478.7 366.3 479 365 479.4C361.8 480.6 357.3 482 356.7 482C356.5 482 355.6 482.2 354.7 482.5C352.9 483 348.4 483.9 345.4 484.3C344.3 484.4 342.7 484.7 341.9 484.8C340.1 485.1 229.4 485.3 225.9 485ZM337.3 453C342.9 452.6 352 450.5 356.1 448.6C356.5 448.4 357.7 447.9 358.6 447.5C360.9 446.5 364.9 444.5 366.6 443.4C368.8 442 369.6 441.4 372.4 439.4C378.2 435 385.8 426.7 389.1 421C391.6 416.7 393.1 413.9 394.5 410.6C396.6 405.9 398.4 399.1 399.4 392.8C399.9 390 399.9 385 399.9 293.2L399.9 196.6L399.3 194.4C394.7 175.7 373.2 175.8 368.6 194.5C368.2 196.1 368.1 197.9 368 206.6C367.8 216.1 367.8 217 367.3 218.2C361.8 233.1 342.3 233.1 336.7 218.2C336.2 216.9 336.1 216.3 336 194.4C335.8 168.4 335.9 169.5 333.3 164.4C327.7 153.5 312.3 153.5 306.7 164.4C304.1 169.5 304.2 168.4 304 194.4C303.8 219.4 304 217.3 302.2 220.9C295.8 233.4 277.8 231.8 272.7 218.2C272.2 216.9 272.1 216.5 272 186C271.8 152.1 271.9 154 270.4 149.9C265.3 136 246.7 136 241.6 149.9C240.1 154 240.2 152.1 240 186C239.9 216.6 239.8 216.9 239.3 218.2C233.6 233.2 214.4 233.2 208.7 218.2L208.1 216.9L208 144.1L207.9 71.4L207.3 69.9C201.7 54.9 182.3 54.9 176.7 69.9L176.1 71.4L176 197.2L175.9 323.1L175.3 324.7C170 339.7 149.9 339.7 144.7 324.7C144.2 323.2 144.1 322.5 144 314C143.9 304 143.9 304 142.4 306.1C141.6 307.3 130.8 321.7 129.5 323.3C124.3 329.8 123.3 341.4 127.2 349.8C128.9 353.5 129.8 354.6 139.3 364.9C140 365.7 142 367.8 143.6 369.6C145.3 371.4 147.1 373.4 147.6 374C148.2 374.6 149 375.5 149.4 375.9C149.7 376.3 151.1 377.7 152.3 379.1C153.6 380.5 155.3 382.3 156.1 383.2C156.9 384.1 158.1 385.4 158.6 386C159.2 386.6 160 387.5 160.4 387.9C160.7 388.3 162.1 389.7 163.3 391.1C164.6 392.5 166.3 394.3 167.1 395.2C168.8 397.1 170.1 398.5 172.2 400.     </svg>
  </div>

  <div id="subtitle"></div>
</div>

<script>
/* =======================================================================
   时间轴定义 —— 改文案只动 script 数组；改时长只动 duration
   所有时间单位：秒
   ======================================================================= */
const TIMELINE = {
  width: 640,
  height: 456,
  fps: 30,
  duration: 4.0,
  script: [
    { from: 0.00, to: 2.55, text: "点击开启 LoveCo 键盘" },
  ],
  // 关键事件（与配音时间轴对齐）
  events: {
    tapToggle: 1.65,   // 点 LoveCo 那一行的开关
    toggleOn:  1.78,   // 开关开始变蓝（填充 0.22s 长满）
    cursorOut: 2.30,   // 光标淡出（抬指离场）
    doneIn:    2.65,   // 对勾弹出
    doneFull:  3.00,
  },
  /* 光标热点（相对 #cursor 左上角）：指尖触碰点，transform-origin 与此一致 */
  hotspot: [25.5, 3.6],
  /* 所有"手指按下"的时刻，给 probe-cursor.mjs 量点击命中用 */
  taps: [1.65],
  /* 光标轨迹关键帧：[时刻, 目标]
     目标可以是绝对坐标 {x,y}，也可以是元素锚点 {el, fx, fy}（fx/fy 是该元素包围盒内的比例位置）。
     锚点每帧实时求解 —— 布局怎么动，指尖都跟着目标走，不脱靶。
     相邻关键帧目标相同 = 原地停顿（点击发生在静止之后，观感更稳）。 */
  cursor: [
    [0.00, { x: 596, y: 356 }],              // 从卡片右下角外升起（起点别落在骨架开关上，不然像"本来就在那"）
    [1.45, { el: '#tgOn', fx: 0.5, fy: 0.5 }],  // 移到 LoveCo 行的开关
    [1.65, { el: '#tgOn', fx: 0.5, fy: 0.5 }],  // 停顿（1.65 点击）
  ],
};

const $ = (s) => document.querySelector(s);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (t) => t < .5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;      // easeInOutQuad
// smootherstep：起点/终点的速度和加速度都为 0 —— 段落之间没有“顿一下”的硬转折
const smoother = (t) => t*t*t*(t*(6*t-15)+10);
const backOut = (t) => 1 + 2.2*Math.pow(t-1,3) + 1.2*Math.pow(t-1,2);
const lerp = (a,b,p) => a + (b-a)*p;

/* 把锚点解析成舞台坐标（getBoundingClientRect 会算上父级 transform） */
function resolveTarget(a){
  if (a.el){
    const r = $(a.el).getBoundingClientRect();
    return [r.left + r.width*a.fx, r.top + r.height*a.fy];
  }
  return [a.x, a.y];
}

function sampleCursor(t){
  const k = TIMELINE.cursor;
  if (t <= k[0][0]) return resolveTarget(k[0][1]);
  for (let i=1;i<k.length;i++){
    if (t <= k[i][0]){
      const [t0,a0] = k[i-1], [t1,a1] = k[i];
      const [x0,y0] = resolveTarget(a0), [x1,y1] = resolveTarget(a1);
      const p = t1===t0 ? 1 : smoother(clamp01((t-t0)/(t1-t0)));
      return [lerp(x0,x1,p), lerp(y0,y1,p)];
    }
  }
  return resolveTarget(k[k.length-1][1]);
}

/* 核心：给定时刻 t，把画面渲染成该时刻应有的样子（纯函数，无动画状态） */
window.__seek = function(t){
  const E = TIMELINE.events;

  /* --- 字幕（单句：整支片子就一句话，末尾 0.22s 淡出给对勾让位） --- */
  const seg = TIMELINE.script.find(s => t >= s.from && t < s.to);
  const sub = $('#subtitle');
  sub.textContent = seg ? seg.text : '';
  sub.style.opacity = seg
    ? (clamp01((t - seg.from)/0.18) * clamp01((seg.to - t)/0.22)).toFixed(4)
    : 0;

  /* --- 开关：蓝底从左往右长满 + 白点滑过去（Material 开关就是这个动画） --- */
  const p = ease(clamp01((t - E.toggleOn)/0.22));
  $('#tgOn .fill').style.width = (p*100).toFixed(2) + '%';
  $('#tgOn .knob').style.left  = (4 + 34*p).toFixed(2) + 'px';

  /* --- 点击波纹（圆心直接读目标元素，布局怎么动都不会偏） --- */
  const RIPPLE_DUR = 0.42;
  const rp = $('#ripple');
  if (t >= E.tapToggle && t < E.tapToggle + RIPPLE_DUR){
    const [rx, ry] = resolveTarget({ el:'#tgOn', fx:0.5, fy:0.5 });
    const q = clamp01((t - E.tapToggle)/RIPPLE_DUR);
    rp.style.display = 'block';
    rp.style.left = rx + 'px';
    rp.style.top  = ry + 'px';
    rp.style.opacity = ((1-q) * 0.9).toFixed(4);
    rp.style.transform = `scale(${lerp(0.35,1.25,q)})`;
  } else rp.style.display = 'none';

  /* --- 光标 --- */
  const [cx, cy] = sampleCursor(t);
  const cout = clamp01((t - E.cursorOut)/0.30);
  const cur = $('#cursor');
  // translate3d + 小数坐标：走合成层，避免取整导致的逐帧抖动
  cur.style.transform = `translate3d(${(cx - TIMELINE.hotspot[0]).toFixed(3)}px, ${(cy - TIMELINE.hotspot[1]).toFixed(3)}px, 0)`;
  cur.style.opacity = (1 - cout).toFixed(4);
  // 点击瞬间轻微下压
  let press = 0;
  if (t >= E.tapToggle && t < E.tapToggle + 0.14) press = 1 - (t - E.tapToggle)/0.14;
  cur.style.transform += ` scale(${1 - press*0.12})`;

  /* --- 完成对勾 --- */
  const d = clamp01((t - E.doneIn)/(E.doneFull - E.doneIn));
  const done = $('#done');
  if (t < E.doneIn){ done.style.display = 'none'; }
  else {
    done.style.display = 'flex';
    done.style.opacity = clamp01(d*2.2);
    done.style.transform = `scale(${backOut(d)})`;
  }
};

/* 浏览器里直接打开时可实时预览；
   带 ?render=1 进入渲染模式（不跑实时动画，只用 __seek 定位）；
   带 ?t=1.23 直接定位到某一时刻（可配合 Chrome --headless --screenshot 使用） */
window.addEventListener('load', ()=>{
  document.fonts.ready.then(()=>{
    const q = new URLSearchParams(location.search);
    if (q.has('t')) { window.__seek(parseFloat(q.get('t'))); return; }
    if (window.__renderMode || q.has('render')) return;
    const start = performance.now();
    (function loop(){
      const t = ((performance.now() - start)/1000) % TIMELINE.duration;
      window.__seek(t);
      requestAnimationFrame(loop);
    })();
  });
});
</script>
</body>
</html>
