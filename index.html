<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F8">
  <title>LoveCo · 键盘交互实验室</title>
  <link rel="icon" href="assets/brand/LoveCo_28_28.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app"></div>
  <!-- 资源层：图标集、协议快照与默认头像插画，均为生成物 -->
  <script src="icons.js"></script>
  <script src="legal-data.js"></script>
  <script src="assets/avatars.js"></script>
  <!-- 组件运行时：渲染工具 + 输入法内核 + 组件注册表（需先于所有组件加载） -->
  <script src="core/kit.js"></script>
  <script src="core/ime.js"></script>
  <script src="core/registry.js"></script>
  <!-- 三端共用组件：改这里，鸿蒙 / Android / iOS 同时生效 -->
  <script src="components/shared/system-glyphs.js"></script>
  <script src="components/shared/host-app.js"></script>
  <script src="components/shared/chat-area.js"></script>
  <script src="components/shared/chat-composer.js"></script>
  <script src="components/shared/kb-toolbar.js"></script>
  <script src="components/shared/kb-candidates.js"></script>
  <script src="components/shared/kb-free-chat.js"></script>
  <script src="components/shared/partner-manager.js"></script>
  <script src="components/shared/kb-settings.js"></script>
  <script src="components/shared/kb-photo-picker.js"></script>
  <script src="components/shared/kb-scan.js"></script>
  <script src="components/shared/kb-chat-analysis.js"></script>
  <script src="components/shared/kb-partner-editor.js"></script>
  <script src="components/shared/kb-full-access.js"></script>
  <script src="components/shared/kb-login.js"></script>
  <script src="components/shared/kb-legal.js"></script>
  <script src="components/shared/kb-paywall.js"></script>
  <script src="components/shared/ios-pay-sheet.js"></script>
  <script src="components/shared/kb-keys.js"></script>
  <script src="components/shared/kb-usage-guide.js"></script>
  <!-- 平台专属组件：同名组件的平台实现优先于共用实现 -->
  <script src="components/harmony/status-bar.js"></script>
  <script src="components/harmony/kb-navbar.js"></script>
  <script src="components/android/status-bar.js"></script>
  <script src="components/android/kb-navbar.js"></script>
  <script src="components/ios/status-bar.js"></script>
  <script src="components/ios/kb-navbar.js"></script>
  <!-- 页面编排：state、事件与 Mock API -->
  <script src="app.js"></script>
</body>
</html>
